<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141124" />
      <stop offset="50%" stop-color="#0d0b17" />
      <stop offset="100%" stop-color="#1a1433" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a9ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <radialGradient id="glowOrb1" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#bfa6ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#bfa6ff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="580" cy="180" r="160" fill="url(#glowOrb1)" filter="url(#softBlur)" />
  <circle cx="180" cy="380" r="120" fill="#6d28d9" fill-opacity="0.15" filter="url(#softBlur)" />

  <!-- Mockup Window Browser Header -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="14" fill="#131021" stroke="#bfa6ff" stroke-opacity="0.18" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="680" height="42" rx="14" fill="#18152b" />
    <rect y="30" width="680" height="12" fill="#18152b" />
    
    <!-- Dots -->
    <circle cx="28" cy="21" r="5" fill="#ff5f56" opacity="0.7" />
    <circle cx="46" cy="21" r="5" fill="#ffbd2e" opacity="0.7" />
    <circle cx="64" cy="21" r="5" fill="#27c93f" opacity="0.7" />

    <!-- Address pill -->
    <rect x="220" y="11" width="240" height="20" rx="10" fill="#0d0b17" opacity="0.7" />
    <text x="340" y="25" fill="#bfa6ff" opacity="0.6" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">preview.design-minimal.studio</text>

    <!-- Mockup Hero Content -->
    <!-- Brand / Nav inside mockup -->
    <rect x="40" y="66" width="30" height="8" rx="4" fill="url(#accentGrad1)" />
    <rect x="520" y="66" width="40" height="8" rx="4" fill="#bfa6ff" opacity="0.4" />
    <rect x="575" y="66" width="40" height="8" rx="4" fill="#bfa6ff" opacity="0.4" />

    <!-- Big Headline Lines -->
    <rect x="40" y="120" width="280" height="24" rx="6" fill="#f6f4fa" opacity="0.95" />
    <rect x="40" y="152" width="200" height="24" rx="6" fill="url(#accentGrad1)" />
    
    <!-- Subtitle lines -->
    <rect x="40" y="196" width="240" height="8" rx="4" fill="#aaa5bc" opacity="0.6" />
    <rect x="40" y="212" width="190" height="8" rx="4" fill="#aaa5bc" opacity="0.4" />

    <!-- CTA Button inside mockup -->
    <rect x="40" y="244" width="110" height="34" rx="17" fill="url(#accentGrad1)" />
    <rect x="162" y="244" width="90" height="34" rx="17" fill="none" stroke="#bfa6ff" stroke-opacity="0.3" stroke-width="1" />

    <!-- Aesthetic Floating Card Right -->
    <g transform="translate(390, 110)">
      <rect width="240" height="220" rx="16" fill="#1b1730" stroke="#bfa6ff" stroke-opacity="0.25" stroke-width="1.2" />
      <rect x="20" y="20" width="200" height="110" rx="10" fill="url(#accentGrad1)" opacity="0.3" />
      
      <!-- Card inner design elements -->
      <circle cx="120" cy="75" r="32" fill="#bfa6ff" opacity="0.4" />
      <polygon points="110,60 135,75 110,90" fill="#ffffff" opacity="0.9" />

      <rect x="20" y="148" width="130" height="12" rx="6" fill="#f6f4fa" opacity="0.8" />
      <rect x="20" y="170" width="180" height="8" rx="4" fill="#aaa5bc" opacity="0.5" />
      <rect x="20" y="186" width="90" height="8" rx="4" fill="url(#accentGrad1)" />
    </g>
  </g>
</svg>
