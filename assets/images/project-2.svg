<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171129" />
      <stop offset="50%" stop-color="#0e0c18" />
      <stop offset="100%" stop-color="#120f21" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <radialGradient id="glowOrb2" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)" rx="16" />

  <!-- Ambient Glow -->
  <circle cx="240" cy="220" r="180" fill="url(#glowOrb2)" filter="url(#softBlur2)" />
  <circle cx="620" cy="350" r="140" fill="#c4a9ff" fill-opacity="0.12" filter="url(#softBlur2)" />

  <!-- Mockup Window Browser -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="14" fill="#131022" stroke="#bfa6ff" stroke-opacity="0.18" stroke-width="1.5" />
    
    <!-- Top bar -->
    <rect width="680" height="42" rx="14" fill="#19152e" />
    <rect y="30" width="680" height="12" fill="#19152e" />
    
    <!-- Window controls -->
    <circle cx="28" cy="21" r="5" fill="#ff5f56" opacity="0.7" />
    <circle cx="46" cy="21" r="5" fill="#ffbd2e" opacity="0.7" />
    <circle cx="64" cy="21" r="5" fill="#27c93f" opacity="0.7" />
    <rect x="220" y="11" width="240" height="20" rx="10" fill="#0c0a16" opacity="0.7" />
    <text x="340" y="25" fill="#bfa6ff" opacity="0.6" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">app.flowtask.dev</text>

    <!-- Sidebar Inside App -->
    <rect x="24" y="60" width="140" height="315" rx="10" fill="#161327" stroke="#bfa6ff" stroke-opacity="0.08" />
    <circle cx="50" cy="88" r="12" fill="url(#accentGrad2)" />
    <rect x="72" y="84" width="70" height="8" rx="4" fill="#f6f4fa" opacity="0.9" />
    
    <rect x="40" y="125" width="105" height="24" rx="6" fill="#251f3d" />
    <rect x="52" y="133" width="75" height="7" rx="3.5" fill="#bfa6ff" />

    <rect x="40" y="160" width="90" height="7" rx="3.5" fill="#6e6982" />
    <rect x="40" y="185" width="80" height="7" rx="3.5" fill="#6e6982" />
    <rect x="40" y="210" width="95" height="7" rx="3.5" fill="#6e6982" />

    <!-- Main Content Area: Kanban / Task Columns -->
    <g transform="translate(185, 60)">
      <!-- Search & Header bar -->
      <rect width="470" height="36" rx="8" fill="#161327" stroke="#bfa6ff" stroke-opacity="0.08" />
      <rect x="20" y="13" width="140" height="10" rx="5" fill="#f6f4fa" opacity="0.85" />
      <rect x="360" y="8" width="90" height="20" rx="10" fill="url(#accentGrad2)" />

      <!-- Column 1 -->
      <rect x="0" y="55" width="225" height="260" rx="10" fill="#17142a" stroke="#bfa6ff" stroke-opacity="0.1" />
      <text x="18" y="82" fill="#c4a9ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">EM PROGRESSO (3)</text>
      
      <!-- Card A -->
      <rect x="15" y="98" width="195" height="65" rx="8" fill="#201b38" stroke="#bfa6ff" stroke-opacity="0.15" />
      <rect x="28" y="112" width="120" height="9" rx="4" fill="#f6f4fa" />
      <rect x="28" y="128" width="160" height="6" rx="3" fill="#aaa5bc" opacity="0.6" />
      <rect x="28" y="145" width="45" height="10" rx="5" fill="#8b5cf6" opacity="0.4" />

      <!-- Card B -->
      <rect x="15" y="174" width="195" height="65" rx="8" fill="#201b38" stroke="#bfa6ff" stroke-opacity="0.15" />
      <rect x="28" y="188" width="90" height="9" rx="4" fill="#f6f4fa" />
      <rect x="28" y="204" width="140" height="6" rx="3" fill="#aaa5bc" opacity="0.6" />
      <rect x="28" y="221" width="55" height="10" rx="5" fill="url(#accentGrad2)" />

      <!-- Column 2 -->
      <rect x="245" y="55" width="225" height="260" rx="10" fill="#17142a" stroke="#bfa6ff" stroke-opacity="0.1" />
      <text x="263" y="82" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">CONCLUÍDO (5)</text>

      <!-- Card C -->
      <rect x="260" y="98" width="195" height="65" rx="8" fill="#201b38" stroke="#bfa6ff" stroke-opacity="0.15" />
      <rect x="273" y="112" width="130" height="9" rx="4" fill="#f6f4fa" />
      <rect x="273" y="128" width="150" height="6" rx="3" fill="#aaa5bc" opacity="0.6" />
      <rect x="273" y="145" width="50" height="10" rx="5" fill="#10b981" opacity="0.4" />

      <!-- Card D -->
      <rect x="260" y="174" width="195" height="65" rx="8" fill="#201b38" stroke="#bfa6ff" stroke-opacity="0.15" />
      <rect x="273" y="188" width="105" height="9" rx="4" fill="#f6f4fa" />
      <rect x="273" y="204" width="135" height="6" rx="3" fill="#aaa5bc" opacity="0.6" />
      <rect x="273" y="221" width="45" height="10" rx="5" fill="#10b981" opacity="0.4" />
    </g>
  </g>
</svg>
